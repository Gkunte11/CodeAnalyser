<template>
    <lightning-card title="Code Analyzer">
        <div class="slds-m-around_medium">

            <lightning-button
                variant="neutral"
                label={buttonLabel}
                onclick={toggleQuickTest}>
            </lightning-button>

            <!-- Quick Test -->

            <template if:true={showQuickTest}>

                <div class="slds-m-top_medium">

                    <lightning-textarea
                        label="Quick Test (paste your code)"
                        onchange={handleInputChange}
                        placeholder="Paste a small snippet of the code here for quick analysis">
                    </lightning-textarea>

                </div>
            </template>
            

            <!-- File Upload -->

            <template if:false={showQuickTest}>

                <div class="slds-m-top_medium">

                    <lightning-file-upload
                        label="Upload File"
                        accept=".java,.py,.js,.html,.cls,.cpp"
                        onuploadfinished={handleUploadFinished}
                        record-id={recordId}
                        multiple=false>
                    </lightning-file-upload>

                </div>
            </template>

            

            <template if:true={uploadedFileName}>
                <p class="slds-m-top_small">Uploaded File:</p>
                <ul>
                    <li>{uploadedFileName}</li>
                </ul>
            </template>


            <!-- Analyze -->
            <div class="slds-m-top_medium">

                <lightning-button label="Analyze and Optimize" onclick={explainCodeSnippet}></lightning-button>

            </div>
            

            <!-- Progress Indicator -->
            <template if:true={isProcessing}>
                <div class="slds-m-top_medium">
                    <lightning-spinner alternative-text="Processing..." size="small"></lightning-spinner>
                    <p>{processingMessage}</p>
                </div>
            </template>

            <!-- Results Tabs -->
            <template if:true={resultsAvailable}>
                <lightning-tabset>
                    <lightning-tab label="Explanation and Optimizations">
                        <template if:true={historyLink}>
                            <p class="slds-m-bottom_small">
                                <lightning-formatted-url 
                                    value={historyLink} 
                                    label="View Full Analysis Record"
                                    target="_blank">
                                </lightning-formatted-url>
                            </p>
                        </template>
                    </lightning-tab>
                    
                </lightning-tabset>
            </template>

        </div>
    </lightning-card>
</template>
