<template>
    <lightning-card title="Code Analyzer">

        <div class="slds-m-top_medium">


            <lightning-textarea label="Paste your code" placeholder="You can paste any code for Claude to analyze" onchange={handleInputChange}></lightning-textarea>

            <div class="slds-m-top_small">

                <lightning-file-upload label="Upload your code" accept=".java,.py,.js,.html,.css,.php,.c,.cpp,.cs,.cls" onuploadfinished={handleUploadFinished}></lightning-file-upload>

            </div>

            <div class="slds-m-top_small">

                <lightning-input type="checkbox" label="Explain line by line" onchange={handleLineByLineChange}></lightning-input>

            </div>


            <div class="slds-m-top_small">
                <lightning-button label="Explain" onclick={explainCodeSnippet}></lightning-button>
            </div>
        
            <div class="slds-m-top_medium">
                <pre>{explanation}</pre>
            </div>

        </div>
        
    </lightning-card>
</template>
